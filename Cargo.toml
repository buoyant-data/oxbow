[workspace]
members = [
    "cli",
    "crates/*",
    "lambdas/*",
]
resolver = "3"

[workspace.package]
version = "1.10.1"
edition = "2024"
keywords = ["deltalake", "parquet", "lambda", "delta", "sqs"]
homepage = "https://github.com/buoyant-data/oxbow"
repository = "https://github.com/buoyant-data/oxbow"
description = "Toolbox for converting or generating Delta Lake tables with AWS Lambda and more"
license-file = "LICENSE.txt"

[workspace.dependencies]
anyhow = "1"
aws-config = "1.10.1"
bytes = "1"
aws-credential-types = "1.3.0"
aws-runtime = "1.9.1"
aws-smithy-async = "1.3.0"
aws-smithy-http = "0.64.0"
aws-smithy-runtime = "1.12.1"
aws-smithy-runtime-api = "1.14.0"
aws-sdk-athena = "1.113.0"
aws-sdk-glue = "1.156.0"
aws-sdk-s3 = "1.140.0"
aws-sdk-sqs = "1.105.0"
aws_lambda_events = { version = "0.15", default-features = false, features = ["sns", "sqs", "s3"] }
chrono = "0.4"
# datafusion 55 support
deltalake = { git = "https://github.com/delta-io/delta-rs", rev = "d983411ce337bcbffc800134b7966d83e4432383", features = ["s3", "json", "datafusion"] }
#deltalake = { version = "0.32.0", features = ["s3", "json", "datafusion"] }
#deltalake = { path = "../../delta-io/delta-rs/crates/deltalake", features = ["s3", "json", "datafusion"]}
futures = "0.3"
lambda_http = "0.13.0"
lambda_runtime = "0.11"
parquet = "59.0"
regex = "1"
serde = "1"
serde_json = "1"
stats_alloc = "0.1.10"
thiserror = "1"
tokio = { version = "1", features = ["macros"] }
tokio-stream = "0.1"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "tracing-log"] }
url = { version = "2.3", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

#[patch.crates-io]
#datafusion = { git = "https://github.com/buoyant-data/datafusion", branch = "buoyant/release-53.0.x" }
#datafusion-datasource = { git = "https://github.com/buoyant-data/datafusion", branch = "buoyant/release-53.0.x" }
#datafusion-physical-expr-adapter = { git = "https://github.com/buoyant-data/datafusion", branch = "buoyant/release-53.0.x" }
#datafusion-ffi = { git = "https://github.com/buoyant-data/datafusion", branch = "buoyant/release-53.0.x" }
#datafusion-proto = { git = "https://github.com/buoyant-data/datafusion", branch = "buoyant/release-53.0.x" }

[profile.release]
panic = "abort"
lto = true
strip = true
codegen-units = 1
incremental = false
opt-level = "z"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

